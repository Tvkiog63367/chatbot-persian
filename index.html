// ===== State =====
let apiKey = localStorage.getItem('chatbot_api_key') || '';
let model = localStorage.getItem('chatbot_model') || 'gpt-4o-mini';
let apiUrl = localStorage.getItem('chatbot_api_url') || 'https://api.openai.com/v1/chat/completions';
let systemPrompt = localStorage.getItem('chatbot_system_prompt') || 'تو یک دستیار مفید و دوستانه فارسی زبان هستی. به سوالات کاربر به فارسی و با جزئیات کامل پاسخ بده.';
let messages = JSON.parse(localStorage.getItem('chatbot_messages') || '[]');
let isGenerating = false;

// ===== Init =====
window.addEventListener('DOMContentLoaded', () => {
    if (!apiKey) {
        setTimeout(() => openSettings(), 500);
    }
    renderMessages();
    document.getElementById('modelSelect').value = model;
    document.getElementById('apiKeyInput').value = apiKey;
    document.getElementById('apiUrlInput').value = apiUrl;
    document.getElementById('systemPromptInput').value = systemPrompt;
});

// ===== Settings Modal =====
function openSettings() {
    document.getElementById('settingsModal').classList.add('active');
}

function closeSettings() {
    document.getElementById('settingsModal').classList.remove('active');
}

function saveSettings() {
    apiKey = document.getElementById('apiKeyInput').value.trim();
    model = document.getElementById('modelSelect').value;
    apiUrl = document.getElementById('apiUrlInput').value.trim() || 'https://api.openai.com/v1/chat/completions';
    systemPrompt = document.getElementById('systemPromptInput').value.trim() || 'تو یک دستیار مفید و دوستانه فارسی زبان هستی.';

    localStorage.setItem('chatbot_api_key', apiKey);
    localStorage.setItem('chatbot_model', model);
    localStorage.setItem('chatbot_api_url', apiUrl);
    localStorage.setItem('chatbot_system_prompt', systemPrompt);

    closeSettings();
    showToast('✅ تنظیمات با موفقیت ذخیره شد', 'success');
}

// ===== Toast =====
function showToast(message, type = 'error') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast ' + type + ' show';
    setTimeout(() => toast.classList.remove('show'), 3500);
}

// ===== Auto Resize Textarea =====
function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ===== Keyboard =====
function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

// ===== Quick Send =====
function quickSend(text) {
    document.getElementById('messageInput').value = text;
    sendMessage();
}

// ===== Get Current Time =====
function getTime() {
    return new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
}

// ===== Render Messages =====
function renderMessages() {
    const chatArea = document.getElementById('chatArea');
    const welcome = document.getElementById('welcomeScreen');

    // Remove old messages
    chatArea.querySelectorAll('.message').forEach(m => m.remove());

    if (messages.length === 0) {
        welcome.style.display = 'flex';
        return;
    }

    welcome.style.display = 'none';

    messages.forEach(msg => {
        appendMessage(msg.role, msg.content, msg.time, false);
    });

    scrollToBottom();
}

// ===== Append Message =====
function appendMessage(role, content, time, animate = true) {
    const chatArea = document.getElementById('chatArea');
    const welcome = document.getElementById('welcomeScreen');
    welcome.style.display = 'none';

    const div = document.createElement('div');
    div.className = `message ${role === 'user' ? 'user' : 'bot'}`;
    if (!animate) div.style.animation = 'none';

    const avatar = role === 'user' ? '👤' : '🤖';
    const formattedContent = formatText(content);

    div.innerHTML = `
        <div class="msg-avatar">${avatar}</div>
        <div>
            <div class="msg-content">${formattedContent}</div>
            <div class="msg-time">${time || getTime()}</div>
        </div>
    `;

    chatArea.appendChild(div);
    scrollToBottom();
}

// ===== Format Text (bold, links, etc.) =====
function formatText(text) {
    // Escape HTML
    let safe = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

    // Bold: **text**
    safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

    // Italic: *text*
    safe = safe.replace(/\*(.*?)\*/g, '<em>$1</em>');

    // Code: `text`
    safe = safe.replace(/`(.*?)`/g, '<code style="background:rgba(108,99,255,0.2);padding:2px 6px;border-radius:4px;font-family:monospace">$1</code>');

    // Links
    safe = safe.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:#818CF8;text-decoration:underline">$1</a>');

    // Line breaks
    safe = safe.replace(/\n/g, '<br>');

    return safe;
}

// ===== Scroll to Bottom =====
function scrollToBottom() {
    const chatArea = document.getElementById('chatArea');
    setTimeout(() => {
        chatArea.scrollTop = chatArea.scrollHeight;
    }, 50);
}

// ===== Send Message =====
async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();

    if (!text || isGenerating) return;

    if (!apiKey) {
        showToast('⚠️ لطفاً ابتدا API Key را وارد کنید');
        openSettings();
        return;
    }

    // Add user message
    const time = getTime();
    messages.push({ role: 'user', content: text, time });
    localStorage.setItem('chatbot_messages', JSON.stringify(messages));
    appendMessage('user', text, time);

    input.value = '';
    input.style.height = 'auto';

    // Show typing
    isGenerating = true;
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('statusText').textContent = 'در حال تایپ...';
    document.getElementById('typingIndicator').classList.add('active');
    scrollToBottom();

    try {
        const apiMessages = [
            { role: 'system', content: systemPrompt },
            ...messages.slice(-20).map(m => ({ role: m.role, content: m.content }))
        ];

        const response = await fetch(apiUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
                model: model,
                messages: apiMessages,
                temperature: 0.7,
                max_tokens: 2000
            })
        });

        if (!response.ok) {
            const err = await response.json().catch(() => ({}));
            throw new Error(err.error?.message || `خطا: ${response.status}`);
        }

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || 'پاسخی دریافت نشد.';

        // Add bot message
        const botTime = getTime();
        messages.push({ role: 'assistant', content: reply, time: botTime });
        localStorage.setItem('chatbot_messages', JSON.stringify(messages));

        document.getElementById('typingIndicator').classList.remove('active');
        appendMessage('bot', reply, botTime);

    } catch (err) {
        document.getElementById('typingIndicator').classList.remove('active');
        showToast('❌ ' + err.message);
        console.error('API Error:', err);
    } finally {
        isGenerating = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('statusText').textContent = 'آماده چت';
    }
}

// ===== Clear Chat =====
function clearChat() {
    if (messages.length === 0) return;
    if (!confirm('آیا مطمئن هستید که می‌خواهید تمام پیام‌ها را پاک کنید؟')) return;

    messages = [];
    localStorage.removeItem('chatbot_messages');

    const chatArea = document.getElementById('chatArea');
    chatArea.querySelectorAll('.message').forEach(m => m.remove());
    document.getElementById('welcomeScreen').style.display = 'flex';
}
</script>
