<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت‌بات هوشمند</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Vazirmatn',sans-serif;background:#0a0a1a;color:#fff;height:100vh;display:flex;justify-content:center}
        .app{width:100%;max-width:850px;height:100vh;display:flex;flex-direction:column;background:#111127}

        /* Header */
        .hdr{padding:16px 20px;background:#16163a;border-bottom:1px solid #2a2a4a;display:flex;align-items:center;justify-content:space-between}
        .hdr-r{display:flex;align-items:center;gap:12px}
        .av{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:20px}
        .hdr h1{font-size:1.05rem;font-weight:600}
        .sts{font-size:.78rem;color:#4ade80;display:flex;align-items:center;gap:5px}
        .sts i{width:7px;height:7px;background:#4ade80;border-radius:50%;display:inline-block;animation:pls 2s infinite}
        @keyframes pls{0%,100%{opacity:1}50%{opacity:.3}}
        .hdr-btns{display:flex;gap:6px}
        .hb{width:36px;height:36px;border-radius:10px;border:1px solid #2a2a4a;background:#1e1e3e;color:#a7a9be;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:.2s}
        .hb:hover{background:#6366f1;color:#fff}

        /* Chat */
        .chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
        .chat::-webkit-scrollbar{width:5px}
        .chat::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:3px}

        /* Welcome */
        .wel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
        .wel-ic{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#6366f1,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:34px}
        .wel h2{font-size:1.4rem}
        .wel p{color:#a7a9be;line-height:2;max-width:380px;font-size:.9rem}
        .qk{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
        .qkb{padding:8px 16px;border-radius:10px;border:1px solid #2a2a4a;background:#1e1e3e;color:#a7a9be;font-family:'Vazirmatn',sans-serif;font-size:.82rem;cursor:pointer;transition:.2s}
        .qkb:hover{border-color:#6366f1;color:#6366f1}

        /* Messages */
        .msg{display:flex;gap:10px;max-width:82%;animation:fi .3s ease}
        @keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .msg.usr{align-self:flex-start;flex-direction:row}
        .msg.bot{align-self:flex-end;flex-direction:row-reverse}
        .ma{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-top:4px}
        .msg.usr .ma{background:linear-gradient(135deg,#f87171,#ea580c)}
        .msg.bot .ma{background:linear-gradient(135deg,#6366f1,#a78bfa)}
        .mb{padding:12px 16px;border-radius:16px;line-height:1.9;font-size:.92rem;white-space:pre-wrap;word-break:break-word}
        .msg.usr .mb{background:#6366f1;border-bottom-right-radius:4px}
        .msg.bot .mb{background:#1e1e3e;border:1px solid #2a2a4a;border-bottom-left-radius:4px;color:#e0e0f0}
        .mt{font-size:.68rem;color:#a7a9be;margin-top:4px;opacity:.5}

        /* Typing */
        .tp{display:none;align-self:flex-end;flex-direction:row-reverse;gap:10px}
        .tp.show{display:flex}
        .tpd{display:flex;gap:4px;padding:16px 20px;background:#1e1e3e;border:1px solid #2a2a4a;border-radius:16px;border-bottom-left-radius:4px}
        .tpd span{width:7px;height:7px;background:#a7a9be;border-radius:50%;animation:bn 1.4s infinite}
        .tpd span:nth-child(2){animation-delay:.2s}
        .tpd span:nth-child(3){animation-delay:.4s}
        @keyframes bn{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

        /* Input */
        .ipa{padding:16px 20px;background:#111127;border-top:1px solid #2a2a4a}
        .ipr{display:flex;gap:10px;align-items:flex-end}
        .ipb{flex:1;background:#1e1e3e;border:2px solid #2a2a4a;border-radius:14px;padding:4px;transition:.2s}
        .ipb:focus-within{border-color:#6366f1}
        .ipb textarea{width:100%;background:0 0;border:none;color:#fff;font-family:'Vazirmatn',sans-serif;font-size:.95rem;padding:10px 14px;resize:none;outline:0;max-height:100px;min-height:44px;line-height:1.6}
        .ipb textarea::placeholder{color:#4a4a6a}
        .sb{width:48px;height:48px;border-radius:14px;border:none;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;font-size:1.2rem;cursor:pointer;transition:.2s}
        .sb:hover{transform:translateY(-1px)}
        .sb:disabled{opacity:.4;cursor:not-allowed}

        /* Modal */
        .ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:center;z-index:999;opacity:0;visibility:hidden;transition:.3s;overflow-y:auto;padding:20px}
        .ov.show{opacity:1;visibility:visible}
        .md{background:#16163a;border:1px solid #2a2a4a;border-radius:20px;padding:30px;width:100%;max-width:500px;transform:scale(.92);transition:.3s;margin:auto}
        .ov.show .md{transform:scale(1)}
        .md h2{text-align:center;margin-bottom:6px;font-size:1.3rem}
        .md>p{text-align:center;color:#a7a9be;font-size:.83rem;margin-bottom:22px;line-height:1.8}
        .fd{margin-bottom:14px}
        .fd label{display:block;margin-bottom:6px;font-size:.83rem;color:#a7a9be;font-weight:500}
        .fd input,.fd select,.fd textarea{width:100%;padding:11px 14px;border-radius:12px;border:2px solid #2a2a4a;background:#1e1e3e;color:#fff;font-family:'Vazirmatn',sans-serif;font-size:.88rem;outline:0;transition:.2s}
        .fd input:focus,.fd select:focus{border-color:#6366f1}
        .fd input::placeholder{color:#4a4a6a}
        .fd select{cursor:pointer}
        .fd textarea{min-height:60px;resize:vertical;line-height:1.7}
        .fd .hint{font-size:.75rem;color:#6b7280;margin-top:4px;line-height:1.6}
        .mbtn{display:flex;gap:10px;margin-top:22px}
        .mb{flex:1;padding:12px;border-radius:12px;border:none;font-family:'Vazirmatn',sans-serif;font-size:.93rem;font-weight:600;cursor:pointer;transition:.2s}
        .mb-s{background:#6366f1;color:#fff}
        .mb-s:hover{background:#4f46e5}
        .mb-c{background:#1e1e3e;color:#a7a9be;border:1px solid #2a2a4a}

        /* Toast */
        .tst{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);padding:12px 24px;border-radius:12px;font-family:'Vazirmatn',sans-serif;font-size:.88rem;color:#fff;z-index:9999;transition:transform .3s}
        .tst.show{transform:translateX(-50%) translateY(0)}
        .tst.ok{background:#10b981}
        .tst.er{background:#ef4444}

        @media(max-width:640px){.app{max-width:100%}.msg{max-width:92%}}
    </style>
</head>
<body>
<div class="app">
    <div class="hdr">
        <div class="hdr-r">
            <div class="av">🤖</div>
            <div><h1>چت‌بات هوشمند</h1><div class="sts"><i></i><span id="stsTx">آماده</span></div></div>
        </div>
        <div class="hdr-btns">
            <button class="hb" id="btnSet" title="تنظیمات">⚙️</button>
            <button class="hb" id="btnClr" title="پاک کردن">🗑️</button>
        </div>
    </div>

    <div class="chat" id="chat">
        <div class="wel" id="wel">
            <div class="wel-ic">✨</div>
            <h2>سلام! 👋</h2>
            <p>دستیار هوش مصنوعی شما. ابتدا از تنظیمات، ارائه‌دهنده هوش مصنوعی و API Key خود را وارد کنید.</p>
            <div class="qk">
                <button class="qkb" data-t="یه شعر فارسی بگو">📝 شعر</button>
                <button class="qkb" data-t="درباره خودت بگو">🤖 معرفی</button>
                <button class="qkb" data-t="یه جوک بگو">😄 جوک</button>
                <button class="qkb" data-t="تاریخ امروز چیه؟">📅 تاریخ</button>
            </div>
        </div>
        <div class="tp" id="tp">
            <div class="ma" style="background:linear-gradient(135deg,#6366f1,#a78bfa)">🤖</div>
            <div class="tpd"><span></span><span></span><span></span></div>
        </div>
    </div>

    <div class="ipa">
        <div class="ipr">
            <div class="ipb"><textarea id="inp" placeholder="پیام بنویسید..." rows="1"></textarea></div>
            <button class="sb" id="btnSend">➤</button>
        </div>
    </div>
</div>

<!-- Settings Modal -->
<div class="ov" id="modal">
    <div class="md">
        <h2>⚙️ تنظیمات هوش مصنوعی</h2>
        <p>ارائه‌دهنده دلخواه خود را انتخاب و API Key را وارد کنید.</p>

        <div class="fd">
            <label>🤖 ارائه‌دهنده (Provider)</label>
            <select id="selProv">
                <option value="openai">OpenAI (ChatGPT)</option>
                <option value="anthropic">Anthropic (Claude)</option>
                <option value="google">Google (Gemini)</option>
                <option value="deepseek">DeepSeek</option>
                <option value="groq">Groq</option>
                <option value="together">Together AI</option>
                <option value="openrouter">OpenRouter</option>
                <option value="custom">سفارشی (Custom)</option>
            </select>
        </div>

        <div class="fd" id="modelField">
            <label>🧠 مدل</label>
            <select id="selModel"></select>
        </div>

        <div class="fd">
            <label>🔑 API Key</label>
            <input type="password" id="inpKey" placeholder="کلید API خود را وارد کنید">
        </div>

        <div class="fd" id="urlField" style="display:none">
            <label>🌐 آدرس API</label>
            <input type="text" id="inpUrl" placeholder="https://api.example.com/v1/chat/completions">
        </div>

        <div class="fd">
            <label>📝 پرامپت سیستم (اختیاری)</label>
            <textarea id="inpPrompt" placeholder="تو یک دستیار فارسی زبان هستی..."></textarea>
        </div>

        <div class="fd">
            <label>🌡️ خلاقیت (Temperature): <span id="tempVal">0.7</span></label>
            <input type="range" id="inpTemp" min="0" max="2" step="0.1" value="0.7" style="padding:0;border:none;background:0 0">
        </div>

        <div class="mbtn">
            <button class="mb mb-c" id="btnCancel">انصراف</button>
            <button class="mb mb-s" id="btnSave">ذخیره</button>
        </div>
    </div>
</div>

<div class="tst" id="tst"></div>

<script>
(function(){
    // ===== Provider Configs =====
    var providers = {
        openai: {
            name: 'OpenAI',
            url: 'https://api.openai.com/v1/chat/completions',
            models: ['gpt-4o','gpt-4o-mini','gpt-4-turbo','gpt-3.5-turbo'],
            defaultModel: 'gpt-4o-mini',
            keyPlaceholder: 'sk-...'
        },
        anthropic: {
            name: 'Anthropic',
            url: 'https://api.anthropic.com/v1/messages',
            models: ['claude-sonnet-4-20250514','claude-3-5-haiku-20241022','claude-3-opus-20240229'],
            defaultModel: 'claude-sonnet-4-20250514',
            keyPlaceholder: 'sk-ant-...'
        },
        google: {
            name: 'Google Gemini',
            url: 'https://generativelanguage.googleapis.com/v1beta/models',
            models: ['gemini-2.0-flash','gemini-1.5-pro','gemini-1.5-flash'],
            defaultModel: 'gemini-2.0-flash',
            keyPlaceholder: 'AIza...'
        },
        deepseek: {
            name: 'DeepSeek',
            url: 'https://api.deepseek.com/v1/chat/completions',
            models: ['deepseek-chat','deepseek-reasoner'],
            defaultModel: 'deepseek-chat',
            keyPlaceholder: 'sk-...'
        },
        groq: {
            name: 'Groq',
            url: 'https://api.groq.com/openai/v1/chat/completions',
            models: ['llama-3.3-70b-versatile','llama-3.1-8b-instant','mixtral-8x7b-32768','gemma2-9b-it'],
            defaultModel: 'llama-3.3-70b-versatile',
            keyPlaceholder: 'gsk_...'
        },
        together: {
            name: 'Together AI',
            url: 'https://api.together.xyz/v1/chat/completions',
            models: ['meta-llama/Meta-Llama-3.1-70B-Instruct-Turbo','mistralai/Mixtral-8x7B-Instruct-v0.1','google/gemma-2-27b-it'],
            defaultModel: 'meta-llama/Meta-Llama-3.1-70B-Instruct-Turbo',
            keyPlaceholder: '...'
        },
        openrouter: {
            name: 'OpenRouter',
            url: 'https://openrouter.ai/api/v1/chat/completions',
            models: ['openai/gpt-4o','anthropic/claude-sonnet-4','meta-llama/llama-3.1-70b-instruct','google/gemini-2.0-flash-001'],
            defaultModel: 'openai/gpt-4o',
            keyPlaceholder: 'sk-or-...'
        },
        custom: {
            name: 'سفارشی',
            url: '',
            models: [],
            defaultModel: '',
            keyPlaceholder: 'API Key'
        }
    };

    // ===== Elements =====
    var $ = function(id){ return document.getElementById(id); };
    var chat = $('chat'), wel = $('wel'), tp = $('tp'), inp = $('inp');
    var btnSend = $('btnSend'), btnSet = $('btnSet'), btnClr = $('btnClr');
    var modal = $('modal'), btnSave = $('btnSave'), btnCancel = $('btnCancel');
    var selProv = $('selProv'), selModel = $('selModel');
    var inpKey = $('inpKey'), inpUrl = $('inpUrl'), inpPrompt = $('inpPrompt');
    var inpTemp = $('inpTemp'), tempVal = $('tempVal');
    var modelField = $('modelField'), urlField = $('urlField');
    var tst = $('tst'), stsTx = $('stsTx');

    // ===== State =====
    var cfg = JSON.parse(localStorage.getItem('cb_cfg') || '{}');
    var prov = cfg.prov || 'openai';
    var apiKey = cfg.key || '';
    var model = cfg.model || '';
    var apiUrl = cfg.url || '';
    var sysPrompt = cfg.prompt || 'تو یک دستیار مفید و دوستانه فارسی زبان هستی. به سوالات کاربر به فارسی و با جزئیات کامل پاسخ بده.';
    var temperature = cfg.temp || 0.7;
    var history = JSON.parse(localStorage.getItem('cb_hist') || '[]');
    var busy = false;

    // ===== Init =====
    function init(){
        selProv.value = prov;
        updateModelList();
        updateUI();
        inpPrompt.value = sysPrompt;
        inpTemp.value = temperature;
        tempVal.textContent = temperature;

        if(model) selModel.value = model;
        if(apiKey) inpKey.value = apiKey;

        if(history.length > 0){
            wel.style.display = 'none';
            history.forEach(function(m){ addMsg(m.role, m.content, m.time, false); });
            scrollDown();
        }

        if(!apiKey){
            setTimeout(function(){ modal.classList.add('show'); }, 500);
        }
    }

    // ===== Provider Change =====
    selProv.addEventListener('change', function(){
        prov = this.value;
        updateModelList();
        updateUI();
        inpKey.value = '';
        inpKey.placeholder = providers[prov].keyPlaceholder;
    });

    function updateModelList(){
        var p = providers[prov];
        selModel.innerHTML = '';
        if(prov === 'custom'){
            modelField.style.display = 'none';
            urlField.style.display = 'block';
        } else {
            modelField.style.display = 'block';
            urlField.style.display = 'none';
            p.models.forEach(function(m){
                var opt = document.createElement('option');
                opt.value = m; opt.textContent = m;
                selModel.appendChild(opt);
            });
            selModel.value = p.defaultModel;
        }
    }

    function updateUI(){
        inpKey.placeholder = providers[prov].keyPlaceholder;
    }

    // ===== Temperature =====
    inpTemp.addEventListener('input', function(){
        tempVal.textContent = this.value;
    });

    // ===== Modal =====
    btnSet.addEventListener('click', function(){ modal.classList.add('show'); });
    btnCancel.addEventListener('click', function(){ modal.classList.remove('show'); });
    modal.addEventListener('click', function(e){ if(e.target===modal) modal.classList.remove('show'); });

    btnSave.addEventListener('click', function(){
        prov = selProv.value;
        apiKey = inpKey.value.trim();
        model = prov === 'custom' ? 'custom' : selModel.value;
        apiUrl = prov === 'custom' ? inpUrl.value.trim() : providers[prov].url;
        sysPrompt = inpPrompt.value.trim() || 'تو یک دستیار مفید و دوستانه فارسی زبان هستی.';
        temperature = parseFloat(inpTemp.value);

        cfg = { prov:prov, key:apiKey, model:model, url:apiUrl, prompt:sysPrompt, temp:temperature };
        localStorage.setItem('cb_cfg', JSON.stringify(cfg));

        modal.classList.remove('show');
        toast('✅ تنظیمات ذخیره شد', 'ok');
    });

    // ===== Clear =====
    btnClr.addEventListener('click', function(){
        if(history.length===0) return;
        if(!confirm('تمام پیام‌ها پاک بشن؟')) return;
        history = [];
        localStorage.removeItem('cb_hist');
        chat.querySelectorAll('.msg').forEach(function(el){ el.remove(); });
        wel.style.display = 'flex';
    });

    // ===== Quick Buttons =====
    document.querySelectorAll('.qkb').forEach(function(b){
        b.addEventListener('click', function(){
            inp.value = b.getAttribute('data-t');
            send();
        });
    });

    // ===== Input =====
    btnSend.addEventListener('click', send);
    inp.addEventListener('keydown', function(e){
        if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
    });
    inp.addEventListener('input', function(){
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    // ===== Send =====
    async function send(){
        var text = inp.value.trim();
        if(!text || busy) return;

        if(!apiKey){
            toast('⚠️ ابتدا API Key را وارد کنید', 'er');
            modal.classList.add('show');
            return;
        }

        var time = getTime();
        history.push({role:'user', content:text, time:time});
        saveHist();
        addMsg('user', text, time);
        inp.value = '';
        inp.style.height = 'auto';

        busy = true;
        btnSend.disabled = true;
        stsTx.textContent = 'در حال تایپ...';
        tp.classList.add('show');
        scrollDown();

        try {
            var reply = '';
            if(prov === 'anthropic'){
                reply = await callAnthropic(text);
            } else if(prov === 'google'){
                reply = await callGoogle(text);
            } else {
                reply = await callOpenAICompatible(text);
            }

            var botTime = getTime();
            history.push({role:'assistant', content:reply, time:botTime});
            saveHist();
            tp.classList.remove('show');
            addMsg('bot', reply, botTime);

        } catch(err){
            tp.classList.remove('show');
            toast('❌ ' + err.message, 'er');
        } finally {
            busy = false;
            btnSend.disabled = false;
            stsTx.textContent = 'آماده';
        }
    }

    // ===== OpenAI Compatible =====
    async function callOpenAICompatible(text){
        var msgs = [{role:'system', content:sysPrompt}];
        history.slice(-20).forEach(function(m){
            msgs.push({role:m.role==='user'?'user':'assistant', content:m.content});
        });

        var res = await fetch(apiUrl, {
            method:'POST',
            headers:{
                'Content-Type':'application/json',
                'Authorization':'Bearer ' + apiKey
            },
            body:JSON.stringify({
                model:model,
                messages:msgs,
                temperature:temperature,
                max_tokens:4000
            })
        });

        if(!res.ok){
            var e = await res.json().catch(function(){return{};});
            throw new Error(e.error?.message || 'خطا: ' + res.status);
        }

        var d = await res.json();
        return d.choices?.[0]?.message?.content || 'پاسخی دریافت نشد.';
    }

    // ===== Anthropic =====
    async function callAnthropic(text){
        var msgs = [];
        history.slice(-20).forEach(function(m){
            msgs.push({role:m.role==='user'?'user':'assistant', content:m.content});
        });

        var res = await fetch(apiUrl, {
            method:'POST',
            headers:{
                'Content-Type':'application/json',
                'x-api-key':apiKey,
                'anthropic-version':'2023-06-01'
            },
            body:JSON.stringify({
                model:model,
                max_tokens:4000,
                system:sysPrompt,
                messages:msgs
            })
        });

        if(!res.ok){
            var e = await res.json().catch(function(){return{};});
            throw new Error(e.error?.message || 'خطا: ' + res.status);
        }

        var d = await res.json();
        return d.content?.[0]?.text || 'پاسخی دریافت نشد.';
    }

    // ===== Google Gemini =====
    async function callGoogle(text){
        var contents = [];
        history.slice(-20).forEach(function(m){
            contents.push({
                role: m.role==='user' ? 'user' : 'model',
                parts:[{text:m.content}]
            });
        });

        var url = apiUrl + '/' + model + ':generateContent?key=' + apiKey;

        var res = await fetch(url, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                contents:contents,
                systemInstruction:{parts:[{text:sysPrompt}]},
                generationConfig:{temperature:temperature, maxOutputTokens:4000}
            })
        });

        if(!res.ok){
            var e = await res.json().catch(function(){return{};});
            throw new Error(e.error?.message || 'خطا: ' + res.status);
        }

        var d = await res.json();
        return d.candidates?.[0]?.content?.parts?.[0]?.text || 'پاسخی دریافت نشد.';
    }

    // ===== Helpers =====
    function addMsg(role, content, time, animate){
        if(animate===undefined) animate=true;
        wel.style.display = 'none';
        var div = document.createElement('div');
        div.className = 'msg ' + (role==='user'?'usr':'bot');
        if(!animate) div.style.animation='none';

        var av = role==='user'?'👤':'🤖';
        var safe = fmt(content);

        div.innerHTML = '<div class="ma">'+av+'</div><div><div class="mb">'+safe+'</div><div class="mt">'+(time||getTime())+'</div></div>';
        chat.insertBefore(div, tp);
        scrollDown();
    }

    function fmt(t){
        var s = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        s = s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
        s = s.replace(/\*(.*?)\*/g,'<em>$1</em>');
        s = s.replace(/`(.*?)`/g,'<code style="background:rgba(99,102,241,.2);padding:2px 6px;border-radius:4px;font-family:monospace">$1</code>');
        s = s.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" style="color:#818cf8;text-decoration:underline">$1</a>');
        s = s.replace(/\n/g,'<br>');
        return s;
    }

    function scrollDown(){
        setTimeout(function(){ chat.scrollTop = chat.scrollHeight; }, 50);
    }

    function getTime(){
        return new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
    }

    function saveHist(){
    localStorage.setItem('cb_hist', JSON.stringify(history));
}

function toast(msg, type){
    tst.textContent = msg;
    tst.className = 'tst ' + (type||'er') + ' show';
    setTimeout(function(){ tst.classList.remove('show'); }, 3500);
}

// ===== Init =====
init();

})();
</script>
