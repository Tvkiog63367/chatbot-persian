<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>چت‌بات فارسی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0F0E17;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #1A1932;
        }

        /* Header */
        .header {
            padding: 16px 20px;
            background: #1E1D3A;

            justify-content: space-between;
        }

        }
        .avatar {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6C63FF, #A78BFA);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }
        .header h1 { font-size: 1.1rem; }
        .header .status { font-size: 0.8rem; color: #4ADE80; }
        .header-btns { display: flex; gap: 8px; }
        .hbtn {
            width: 38px; height: 38px;
            border-radius: 10px;
            border: 1px solid #2E2D4A;
            background: #232342;
            color: #A7A9BE;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;

        .hbtn:hover { background: #6C63FF; color: #fff; }

        /* Chat */
        .chat {
            flex: 1;

            display: flex;
            flex-direction: column;

        }
        .chat::-webkit-scrollbar { width: 5px; }
        .chat::-webkit-scrollbar-thumb { background: #2E2D4A; border-radius: 3px; }

        /* Welcome */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        }
        .welcome-icon {
            width: 70px; height: 70px;
            border-radius: 20px;
            background: linear-gradient(135deg, #6C63FF, #A78BFA);
            display: flex; align-items: center; justify-content: center;
            font-size: 36px;
        }
        .welcome p { color: #A7A9BE; line-height: 2; max-width: 350px; }
        .quick-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
        .qbtn {
            padding: 8px 16px; border-radius: 10px;

        }
        .qbtn:hover { border-color: #6C63FF; color: #6C63FF; }

        /* Messages */
        .msg {
            display: flex; gap: 10px; max-width: 85%;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .msg.user { align-self: flex-start; flex-direction: row; }
        .msg.bot { align-self: flex-end; flex-direction: row-reverse; }

            width: 34px; height: 34px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0; margin-top: 4px;
        }
        .msg.user .msg-av { background: linear-gradient(135deg, #FF6B6B, #EE5A24); }
        .msg.bot .msg-av { background: linear-gradient(135deg, #6C63FF, #A78BFA); }
        .msg-body {
            padding: 12px 18px; border-radius: 16px;
            line-height: 1.8; font-size: 0.93rem;
            white-space: pre-wrap; word-break: break-word;
        }
        .msg.user .msg-body { background: #6C63FF; border-bottom-right-radius: 4px; }
        .msg.bot .msg-body { background: #232342; border: 1px solid #2E2D4A; border-bottom-left-radius: 4px; color: #E8E8F0; }
        .msg-time { font-size: 0.7rem; color: #A7A9BE; margin-top: 4px; opacity: 0.6; }

        /* Typing */
        .typing {
            display: none; align-self: flex-end;
            flex-direction: row-reverse; gap: 10px;
        }
        .typing.show { display: flex; }
        .typing-dots {
            display: flex; gap: 4px; padding: 16px 22px;
            background: #232342; border: 1px solid #2E2D4A;
            border-radius: 16px; border-bottom-left-radius: 4px;
        }

            width: 7px; height: 7px; background: #A7A9BE;
            border-radius: 50%; animation: bounce 1.4s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:0.4; } 30% { transform:translateY(-6px); opacity:1; } }

        /* Input */
        .input-area {
            padding: 16px 20px;
            background: #1A1932;
            border-top: 1px solid #2E2D4A;
        }
        .input-row { display: flex; gap: 10px; align-items: flex-end; }
        .input-box {
            flex: 1; background: #232342;
            border: 2px solid #2E2D4A; border-radius: 14px;
            padding: 4px; transition: border-color 0.3s;
        }
        .input-box:focus-within { border-color: #6C63FF; }
        .input-box textarea {
            width: 100%; background: transparent; border: none;
            color: #fff; font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem; padding: 10px 14px;
            resize: none; outline: none; max-height: 100px;
            min-height: 44px; line-height: 1.6;
        }
        .input-box textarea::placeholder { color: #4A4A6A; }
        .send-btn {
            width: 48px; height: 48px; border-radius: 14px;
            border: none; background: linear-gradient(135deg, #6C63FF, #5A52D5);
            color: #fff; font-size: 1.2rem; cursor: pointer;
        }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Modal */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
            display: flex; justify-content: center; align-items: center;
            z-index: 999; opacity: 0; visibility: hidden; transition: all 0.3s;
        }
        .overlay.show { opacity: 1; visibility: visible; }
        .modal {
            background: #1A1932; border: 1px solid #2E2D4A;
            border-radius: 20px; padding: 30px; width: 90%; max-width: 460px;
            transform: scale(0.9); transition: all 0.3s;
        }
        .overlay.show .modal { transform: scale(1); }
        .modal h2 { text-align: center; margin-bottom: 6px; font-size: 1.3rem; }
        .modal p { text-align: center; color: #A7A9BE; font-size: 0.85rem; margin-bottom: 20px; line-height: 1.8; }
        .field { margin-bottom: 14px; }
        .field label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #A7A9BE; }
        .field input, .field select {
            width: 100%; padding: 12px 16px; border-radius: 12px;
            border: 2px solid #2E2D4A; background: #232342;
            color: #fff; font-family: 'Vazirmatn', sans-serif;
            font-size: 0.9rem; outline: none;
        }
        .field input:focus { border-color: #6C63FF; }
        .field input::placeholder { color: #4A4A6A; }
        .field select { cursor: pointer; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .mbtn {
            flex: 1; padding: 12px; border-radius: 12px; border: none;
            font-family: 'Vazirmatn', sans-serif; font-size: 0.95rem;
            font-weight: 600; cursor: pointer;
        }
        .mbtn-save { background: #6C63FF; color: #fff; }
        .mbtn-cancel { background: #232342; color: #A7A9BE; border: 1px solid #2E2D4A; }

        /* Toast */
        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            padding: 12px 24px; border-radius: 12px;
            font-family: 'Vazirmatn', sans-serif; font-size: 0.9rem;
            color: #fff; z-index: 9999; transition: transform 0.3s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.ok { background: #10B981; }
        .toast.err { background: #EF4444; }

        @media (max-width: 640px) {
            .container { max-width: 100%; }
            .msg { max-width: 92%; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="header-right">
            <div class="avatar">🤖</div>
            <div>
                <h1>چت‌بات فارسی</h1>
                <div class="status" id="statusText">● آماده</div>
            </div>
        </div>
        <div class="header-btns">
            <button class="hbtn" id="settingsBtn" title="تنظیمات">⚙️</button>
            <button class="hbtn" id="clearBtn" title="پاک کردن">🗑️</button>
        </div>
    </div>

    <!-- Chat -->
    <div class="chat" id="chatArea">
        <div class="welcome" id="welcomeScreen">
            <div class="welcome-icon">✨</div>
            <h2>سلام! 👋</h2>
            <p>من دستیار هوش مصنوعی شما هستم. ابتدا API Key خود را تنظیم کنید.</p>
            <div class="quick-btns">
                <button class="qbtn" data-text="یه شعر فارسی بگو">📝 شعر</button>
                <button class="qbtn" data-text="درباره خودت بگو">🤖 معرفی</button>
                <button class="qbtn" data-text="یه جوک بگو">😄 جوک</button>
            </div>
        </div>
        <div class="typing" id="typing">
            <div class="msg-av" style="background:linear-gradient(135deg,#6C63FF,#A78BFA)">🤖</div>
            <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
    </div>

    <!-- Input -->
    <div class="input-area">
        <div class="input-row">
            <div class="input-box">
                <textarea id="msgInput" placeholder="پیام بنویسید..." rows="1"></textarea>
            </div>
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>
</div>

<!-- Settings Modal -->
<div class="overlay" id="modal">
    <div class="modal">
        <h2>⚙️ تنظیمات</h2>
        <p>API Key خود را وارد کنید. اطلاعات فقط در مرورگر ذخیره می‌شود.</p>
        <div class="field">
            <label>مدل</label>
            <select id="selModel">
                <option value="gpt-4o-mini">GPT-4o Mini (ارزان)</option>
                <option value="gpt-4o">GPT-4o</option>
                <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
            </select>
        </div>
        <div class="field">
            <label>API Key</label>
            <input type="password" id="inpKey" placeholder="sk-xxxxxxxx">
        </div>
        <div class="field">
            <label>آدرس API (اختیاری)</label>
            <input type="text" id="inpUrl" placeholder="https://api.openai.com/v1/chat/completions">
        </div>
        <div class="modal-btns">
            <button class="mbtn mbtn-cancel" id="cancelBtn">انصراف</button>
            <button class="mbtn mbtn-save" id="saveBtn">ذخیره</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function() {
    // Elements
    var chatArea = document.getElementById('chatArea');
    var welcome = document.getElementById('welcomeScreen');
    var typing = document.getElementById('typing');
    var msgInput = document.getElementById('msgInput');
    var sendBtn = document.getElementById('sendBtn');
    var modal = document.getElementById('modal');
    var settingsBtn = document.getElementById('settingsBtn');
    var clearBtn = document.getElementById('clearBtn');
    var saveBtn = document.getElementById('saveBtn');
    var cancelBtn = document.getElementById('cancelBtn');
    var toastEl = document.getElementById('toast');
    var statusText = document.getElementById('statusText');
    var selModel = document.getElementById('selModel');
    var inpKey = document.getElementById('inpKey');
    var inpUrl = document.getElementById('inpUrl');

    // State
    var apiKey = localStorage.getItem('cb_key') || '';
    var model = localStorage.getItem('cb_model') || 'gpt-4o-mini';
    var apiUrl = localStorage.getItem('cb_url') || 'https://api.openai.com/v1/chat/completions';
    var history = JSON.parse(localStorage.getItem('cb_hist') || '[]');
    var busy = false;

    // Load settings
    selModel.value = model;
    inpKey.value = apiKey;
    inpUrl.value = apiUrl === 'https://api.openai.com/v1/chat/completions' ? '' : apiUrl;

    // Render old messages
    if (history.length > 0) {
        welcome.style.display = 'none';
        history.forEach(function(m) { addMsg(m.role, m.content, m.time, false); });
        scrollDown();
    }

    // Settings button
    settingsBtn.addEventListener('click', function() { modal.classList.add('show'); });

    // Cancel
    cancelBtn.addEventListener('click', function() { modal.classList.remove('show'); });

    // Close modal on overlay click
    modal.addEventListener('click', function(e) {
        if (e.target === modal) modal.classList.remove('show');
    });

    // Save
    saveBtn.addEventListener('click', function() {
        apiKey = inpKey.value.trim();
        model = selModel.value;
        var customUrl = inpUrl.value.trim();
        apiUrl = customUrl || 'https://api.openai.com/v1/chat/completions';
        localStorage.setItem('cb_key', apiKey);
        localStorage.setItem('cb_model', model);
        localStorage.setItem('cb_url', apiUrl);
        modal.classList.remove('show');
        showToast('✅ ذخیره شد', 'ok');
    });

    // Clear
    clearBtn.addEventListener('click', function() {
        if (history.length === 0) return;
        if (!confirm('پیام‌ها پاک بشن؟')) return;
        history = [];
        localStorage.removeItem('cb_hist');
        chatArea.querySelectorAll('.msg').forEach(function(el) { el.remove(); });
        welcome.style.display = 'flex';
    });

    // Quick buttons
    document.querySelectorAll('.qbtn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            msgInput.value = btn.getAttribute('data-text');
            send();
        });
    });

    // Send button
    sendBtn.addEventListener('click', send);

    // Enter key
    msgInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    });

    // Auto resize
    msgInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });


    function getTime() {
    return new Date().toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
}

// Send message
async function send() {
    var text = msgInput.value.trim();
    if (!text || busy) return;

    if (!apiKey) {
        showToast('⚠️ ابتدا API Key را وارد کنید', 'err');
        modal.classList.add('show');
        return;
    }

    // Add user message
    var time = getTime();
    history.push({role:'user', content:text, time:time});
    localStorage.setItem('cb_hist', JSON.stringify(history));
    addMsg('user', text, time);

    msgInput.value = '';
    msgInput.style.height = 'auto';

    // Show typing
    busy = true;
    sendBtn.disabled = true;
    statusText.textContent = '● در حال تایپ...';
    typing.classList.add('show');
    scrollDown();

    try {
        var apiMessages = [
            {role:'system', content:'تو یک دستیار مفید و دوستانه فارسی زبان هستی. به سوالات کاربر به فارسی و با جزئیات پاسخ بده.'},
        ];

        // Add last 20 messages
        var recent = history.slice(-20);
        for (var i = 0; i < recent.length; i++) {
            apiMessages.push({
                role: recent[i].role === 'user' ? 'user' : 'assistant',
                content: recent[i].content
            });
        }

        var response = await fetch(apiUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + apiKey
            },
            body: JSON.stringify({
                model: model,
                messages: apiMessages,
                temperature: 0.7,
                max_tokens: 2000
            })
        });

        if (!response.ok) {
            var errData = await response.json().catch(function() { return {}; });
            throw new Error(errData.error?.message || 'خطا: ' + response.status);
        }

        var data = await response.json();
        var reply = data.choices && data.choices[0] && data.choices[0].message
            ? data.choices[0].message.content
            : 'پاسخی دریافت نشد.';

        // Add bot message
        var botTime = getTime();
        history.push({role:'assistant', content:reply, time:botTime});
        localStorage.setItem('cb_hist', JSON.stringify(history));

        typing.classList.remove('show');
        addMsg('bot', reply, botTime);

    } catch(err) {
        typing.classList.remove('show');
        showToast('❌ ' + err.message, 'err');
    } finally {
        busy = false;
        sendBtn.disabled = false;
        statusText.textContent = '● آماده';
    }
}

// Add message to chat
function addMsg(role, content, time, animate) {
    if (animate === undefined) animate = true;

    welcome.style.display = 'none';

    var div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    if (!animate) div.style.animation = 'none';

    var avatar = role === 'user' ? '👤' : '🤖';
    var safeContent = formatText(content);

    div.innerHTML =
        '<div class="msg-av">' + avatar + '</div>' +
        '<div>' +
            '<div class="msg-body">' + safeContent + '</div>' +
            '<div class="msg-time">' + (time || getTime()) + '</div>' +
        '</div>';

    chatArea.insertBefore(div, typing);
    scrollDown();
}

// Format text
function formatText(text) {
    var safe = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

    // Bold
    safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

    // Italic
    safe = safe.replace(/\*(.*?)\*/g, '<em>$1</em>');

    // Code
    safe = safe.replace(/`(.*?)`/g, '<code style="background:rgba(108,99,255,0.2);padding:2px 6px;border-radius:4px;font-family:monospace">$1</code>');

    // Links
    safe = safe.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:#818CF8;text-decoration:underline">$1</a>');

    // New lines
    safe = safe.replace(/\n/g, '<br>');

    return safe;
}

// Scroll down
function scrollDown() {
    setTimeout(function() {
        chatArea.scrollTop = chatArea.scrollHeight;
    }, 50);
}

// Toast
function showToast(msg, type) {
    toastEl.textContent = msg;
    toastEl.className = 'toast ' + (type || 'err') + ' show';
    setTimeout(function() {
        toastEl.classList.remove('show');
    }, 3000);
}

// Open settings if no API key
if (!apiKey) {
    setTimeout(function() {
        modal.classList.add('show');
    }, 600);
}

})();
</script>
</body>
</html>
